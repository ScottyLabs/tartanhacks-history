<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TartanHacks 2027</title>
    <meta name="description" content="TartanHacks 2027 placeholder" />
    <style>
      :root {
        color-scheme: dark;
        --red: #c41230;
        --ink: #f6f1ea;
        --muted: #cbb8b2;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        padding: 2.5rem 1.25rem;
        font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
        color: var(--ink);
        background:
          linear-gradient(180deg, rgba(16, 6, 8, 0.25), rgba(16, 6, 8, 0.88)),
          repeating-linear-gradient(
            90deg,
            #6e1020 0 18px,
            #14080c 18px 36px,
            #8a1c2c 36px 42px,
            #14080c 42px 72px
          );
      }

      main {
        width: min(40rem, calc(100% - 2.5rem));
        padding: 2.75rem 2rem;
        text-align: center;
        background: rgba(12, 6, 8, 0.84);
        border: 1px solid rgba(246, 241, 234, 0.16);
      }

      p {
        margin: 0;
      }

      .kicker {
        font-family: system-ui, sans-serif;
        font-size: 0.75rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--muted);
      }

      h1 {
        margin: 0.8rem 0 0;
        font-size: clamp(2.6rem, 8vw, 4.6rem);
        font-weight: 500;
        letter-spacing: -0.03em;
        line-height: 0.95;
      }

      h1 span {
        color: var(--red);
      }

      .lede {
        margin-top: 1.1rem;
        font-family: system-ui, sans-serif;
        font-size: 1.05rem;
        line-height: 1.5;
        color: var(--muted);
      }

      .sponsors {
        width: min(64rem, 100%);
        padding: 1.75rem 1.5rem 2rem;
        text-align: center;
        background: rgba(12, 6, 8, 0.84);
        border: 1px solid rgba(246, 241, 234, 0.16);
      }

      .sponsors h2,
      .sponsors h3 {
        font-family: system-ui, sans-serif;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .sponsors h2 {
        margin: 0;
        font-size: 0.8rem;
        color: var(--muted);
      }

      .sponsors h3 {
        margin: 0 0 0.85rem;
        font-size: 0.68rem;
        color: var(--ink);
      }

      .tier {
        margin-top: 1.5rem;
      }

      .tier ul {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.75rem;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .tier li {
        display: grid;
        place-items: center;
        min-width: 7.5rem;
        min-height: 4.25rem;
        padding: 0.7rem 0.9rem;
        background: #f6f1ea;
      }

      .tier img {
        display: block;
        width: auto;
        max-width: 8rem;
        max-height: 2.75rem;
        object-fit: contain;
      }

      .tier--title img {
        max-width: 14rem;
        max-height: 4.5rem;
      }

      .tier--premier img {
        max-width: 10rem;
        max-height: 3.4rem;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="kicker">ScottyLabs</p>
      <h1>TartanHacks <span>2027</span></h1>
      <p class="lede">Placeholder site. The 2027 archive will live here.</p>
    </main>
    <section class="sponsors" id="sponsors" aria-labelledby="sponsors-heading">
      <h2 id="sponsors-heading">Sponsors</h2>
      <!-- sponsors:start -->
      <div class="tier tier--title">
        <h3>Title sponsor</h3>
        <ul>
          <li><img src="./imgs/sponsors/Title/applovin.png" alt="applovin" /></li>
        </ul>
      </div>
      <div class="tier tier--premier">
        <h3>Premier sponsors</h3>
        <ul>
          <li><img src="./imgs/sponsors/Premier/capitalone.webp" alt="capitalone" /></li>
          <li><img src="./imgs/sponsors/Premier/doordash.jpg" alt="doordash" /></li>
          <li><img src="./imgs/sponsors/Premier/hrt.png" alt="hrt" /></li>
          <li><img src="./imgs/sponsors/Premier/mechanize.png" alt="mechanize" /></li>
          <li><img src="./imgs/sponsors/Premier/ripple.png" alt="ripple" /></li>
          <li><img src="./imgs/sponsors/Premier/salesforce.webp" alt="salesforce" /></li>
        </ul>
      </div>
      <div class="tier tier--partner">
        <h3>Partner sponsors</h3>
        <ul>
          <li><img src="./imgs/sponsors/Partner/accenture.webp" alt="accenture" /></li>
          <li><img src="./imgs/sponsors/Partner/anduril.png" alt="anduril" /></li>
          <li><img src="./imgs/sponsors/Partner/citadel.png" alt="citadel" /></li>
          <li><img src="./imgs/sponsors/Partner/decagon.jpg" alt="decagon" /></li>
          <li><img src="./imgs/sponsors/Partner/deshaw-co.webp" alt="deshaw-co" /></li>
          <li><img src="./imgs/sponsors/Partner/optiver.jpg" alt="optiver" /></li>
          <li><img src="./imgs/sponsors/Partner/perplexity.jpg" alt="perplexity" /></li>
          <li><img src="./imgs/sponsors/Partner/recruit-holdings.png" alt="recruit-holdings" /></li>
          <li><img src="./imgs/sponsors/Partner/runpod.png" alt="runpod" /></li>
          <li>
            <img
              src="./imgs/sponsors/Partner/sandia-national-laboratories.webp"
              alt="sandia-national-laboratories"
            />
          </li>
        </ul>
      </div>
      <!-- sponsors:end -->
    </section>
  </body>
</html>
