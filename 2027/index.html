<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TartanHacks 2027</title>
  <meta name="description" content="TartanHacks 2027 placeholder" />
  <style>
    :root {
      color-scheme: dark;
      --red: #c41230;
      --ink: #f6f1ea;
      --muted: #cbb8b2;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
      color: var(--ink);
      background:
        linear-gradient(180deg, rgba(16, 6, 8, 0.25), rgba(16, 6, 8, 0.88)),
        repeating-linear-gradient(
          90deg,
          #6e1020 0 18px,
          #14080c 18px 36px,
          #8a1c2c 36px 42px,
          #14080c 42px 72px
        );
    }

    main {
      width: min(40rem, calc(100% - 2.5rem));
      padding: 2.75rem 2rem;
      text-align: center;
      background: rgba(12, 6, 8, 0.84);
      border: 1px solid rgba(246, 241, 234, 0.16);
    }

    p {
      margin: 0;
    }

    .kicker {
      font-family: system-ui, sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
    }

    h1 {
      margin: 0.8rem 0 0;
      font-size: clamp(2.6rem, 8vw, 4.6rem);
      font-weight: 500;
      letter-spacing: -0.03em;
      line-height: 0.95;
    }

    h1 span {
      color: var(--red);
    }

    .lede {
      margin-top: 1.1rem;
      font-family: system-ui, sans-serif;
      font-size: 1.05rem;
      line-height: 1.5;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <p class="kicker">ScottyLabs</p>
    <h1>TartanHacks <span>2027</span></h1>
    <p class="lede">Placeholder site. The 2027 archive will live here.</p>
  </main>
</body>
</html>
